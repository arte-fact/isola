name: php
description: "PHP + Composer + Laravel Installer"
version: "1.0.0"
layer: project
provision:
  script: install.sh
  verify: "php --version"
paths:
  bin: []
  copy: []
prompts:
  - name: version
    message: "PHP version:"
    env_var: PHP_VERSION
    choices: ["8.4", "8.3", "8.2", "8.1"]
    default: "8.4"
