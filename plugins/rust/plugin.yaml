name: rust
description: "Rust (rustup + cargo)"
version: "1.0.0"
layer: project
provision:
  script: install.sh
  verify: "rustc --version && cargo --version"
paths:
  bin:
    - /home/sandbox/.cargo/bin
  copy:
    - from: /root/.cargo
      to: /home/sandbox/.cargo
    - from: /root/.rustup
      to: /home/sandbox/.rustup
