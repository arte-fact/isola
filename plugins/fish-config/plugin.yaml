name: fish-config
description: "Import host fish shell configuration"
version: "1.0.0"
layer: user
auto_detect:
  host_path: .config/fish
provision:
  script: ~
paths:
  host_copy:
    - from: .config/fish
      to: .config/fish
    - from: .config/omf
      to: .config/omf
    - from: .local/share/omf
      to: .local/share/omf
    - from: .cargo/env.fish
      to: .cargo/env.fish
