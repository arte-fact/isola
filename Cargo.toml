[workspace]
members = ["crates/isola-core", "crates/isola-cli", "crates/isola-uidmap"]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/arte-fact/isola"

[workspace.dependencies]
# version is required so isola-cli can be published to crates.io (path is used
# for local workspace builds, version for the published dependency).
isola-core = { path = "crates/isola-core", version = "1.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["blocking"] }
flate2 = "1"
tar = "0.4"
nix = { version = "0.31", features = ["sched", "mount", "user", "signal", "process", "fs"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
inquire = "0.9"
indicatif = "0.18"
console = "0.16.3"
tempfile = "3.27.0"
