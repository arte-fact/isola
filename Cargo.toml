[package]
name = "isola"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking"] }
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
inquire = "0.9"
indicatif = "0.18"
clap_complete = "4"
console = "0.16.3"

[[bin]]
name = "isola-uidmap"
path = "src/bin/isola-uidmap.rs"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["sched", "mount", "user", "signal", "process", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
