name: go
description: "Go (latest)"
version: "1.0.0"
layer: project
provision:
  script: install.sh
  verify: "/usr/local/go/bin/go version"
paths:
  bin:
    - /usr/local/go/bin
  copy: []
  cache:
    - name: go-mod
      to: /home/sandbox/go/pkg/mod
    - name: go-build
      to: /home/sandbox/.cache/go-build
