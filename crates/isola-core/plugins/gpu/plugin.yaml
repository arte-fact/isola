name: gpu
description: "GPU device access (video/render groups, DRM, KFD, NVIDIA)"
version: "1.0.0"
layer: project
provision:
  script: install.sh
  verify: "id sandbox | grep -q video"
paths:
  device:
    # Universal
    - path: /dev/dri
    # AMD (KFD for ROCm/HIP)
    - path: /dev/kfd
    # NVIDIA
    - path: /dev/nvidia0
    - path: /dev/nvidia1
    - path: /dev/nvidia2
    - path: /dev/nvidia3
    - path: /dev/nvidiactl
    - path: /dev/nvidia-uvm
    - path: /dev/nvidia-modeset
